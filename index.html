<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="一个可爱的像素风小测试，看看你能答对多少题。"
    />
    <title>关于我的小测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-live="polite">
      <section class="game-stage" id="app"></section>
    </main>

    <template id="progress-template">
      <div class="progress-panel">
        <div class="progress-topline">
          <span>关于我的小测试</span>
          <strong data-progress-count></strong>
        </div>
        <div
          class="progress-track"
          data-progress-bar
          role="progressbar"
          aria-label="答题进度"
          aria-valuemin="0"
          aria-valuemax="15"
        >
          <span class="progress-fill" data-progress-fill></span>
        </div>
      </div>
    </template>

    <template id="intro-template">
      <div class="screen screen-intro">
        <div class="progress-slot"></div>

        <div class="pixel-sparkles" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <section class="hero-copy pixel-card">
          <p class="label">PIXEL TEST</p>
          <h1>关于我的<br />小测试</h1>
          <p>看看你对我了解多少吧。</p>
        </section>

        <div class="gameboy" aria-hidden="true">
          <div class="gameboy-screen">
            <div class="pixel-face">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="mouth"></span>
            </div>
          </div>
          <span class="cross-key"></span>
          <span class="round-key key-a"></span>
          <span class="round-key key-b"></span>
        </div>

        <div class="intro-actions">
          <button class="primary-button" data-action="start">开始测试</button>
          <button class="text-button" data-action="use-passcode">我有通关密码</button>
        </div>
      </div>
    </template>

    <template id="passcode-template">
      <div class="screen screen-passcode">
        <div class="progress-slot"></div>

        <section class="passcode-card pixel-card">
          <p class="label">SECRET CODE</p>
          <h2>输入通关密码</h2>
          <p>输入四位数字，就可以跳过测试去打开信箱。</p>

          <label class="passcode-label" for="passcode-input">四位数字密码</label>
          <div class="passcode-entry" data-passcode-entry>
            <div class="passcode-digits" aria-hidden="true">
              <span class="passcode-digit"></span>
              <span class="passcode-digit"></span>
              <span class="passcode-digit"></span>
              <span class="passcode-digit"></span>
            </div>
            <input
              class="passcode-input"
              id="passcode-input"
              data-passcode-input
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="4"
              pattern="[0-9]*"
              aria-describedby="passcode-feedback"
            />
          </div>

          <p class="passcode-feedback" id="passcode-feedback" data-passcode-feedback>
            密码藏在测试的终点。
          </p>
        </section>

        <div class="passcode-actions">
          <button class="primary-button" data-action="confirm-passcode">确认密码</button>
          <button class="text-button" data-action="back-home">返回首页</button>
        </div>
      </div>
    </template>

    <template id="quiz-template">
      <div class="screen screen-quiz">
        <div class="progress-slot"></div>

        <section class="question-card pixel-card">
          <div class="question-meta">
            <span data-question-count></span>
            <span data-question-type></span>
          </div>
          <h2 data-question-title></h2>
        </section>

        <div class="answers" data-answers></div>

        <button class="secondary-button" data-action="submit-answer">确认答案</button>

        <p class="feedback" data-feedback>选一个答案吧。</p>
      </div>
    </template>

    <template id="passcode-reward-template">
      <div class="screen screen-passcode-reward">
        <div class="progress-slot"></div>

        <section class="reward-copy">
          <p class="label">CODE FOUND</p>
          <h2>获得通关密码！</h2>
          <p>把它记下来。这是打开最后一封信的小钥匙。</p>
        </section>

        <div class="passcode-display" aria-label="通关密码 0326">
          <span>0</span>
          <span>3</span>
          <span>2</span>
          <span>6</span>
        </div>

        <div class="pixel-key" aria-hidden="true">
          <span></span>
        </div>

        <button class="primary-button is-pink" data-action="continue-to-mailbox">
          去打开信箱
        </button>
      </div>
    </template>

    <template id="complete-template">
      <div class="screen screen-complete">
        <div class="progress-slot"></div>

        <section class="complete-copy">
          <p class="label">LEVEL CLEAR</p>
          <h2 data-complete-title>测试完成！</h2>
          <p data-complete-message>你真的很了解我。现在，有一封小信准备好了。</p>
        </section>

        <div class="mailbox-scene" aria-hidden="true">
          <div class="pixel-cloud cloud-a"></div>
          <div class="pixel-cloud cloud-b"></div>
          <div class="mailbox">
            <span class="mailbox-flag"></span>
            <span class="mail-letter"></span>
          </div>
          <div class="pixel-grass"></div>
        </div>

        <button class="primary-button is-pink" data-action="open-letter">打开信箱</button>
      </div>
    </template>

    <template id="letter-template">
      <div class="screen screen-letter">
        <div class="progress-slot"></div>

        <article class="letter-card pixel-card">
          <p class="label">SECRET LETTER</p>
          <h2>给你的信</h2>
          <div class="letter-body" data-letter-body></div>
        </article>

        <button class="secondary-button" data-action="restart">再看一次测试</button>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
