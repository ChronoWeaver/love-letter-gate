<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="一个像素风小测试，完成后会解锁一封特别的信。"
    />
    <title>关于我的小测试</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell" aria-live="polite">
      <section class="game-stage" id="app"></section>
    </main>

    <template id="progress-template">
      <div class="progress-panel">
        <div class="progress-topline">
          <span>关于我的小测试</span>
          <strong data-progress-count></strong>
        </div>
        <div
          class="progress-track"
          data-progress-bar
          role="progressbar"
          aria-label="答题进度"
          aria-valuemin="0"
          aria-valuemax="15"
        >
          <span class="progress-fill" data-progress-fill></span>
        </div>
      </div>
    </template>

    <template id="intro-template">
      <div class="screen screen-intro">
        <div class="progress-slot"></div>

        <div class="pixel-sparkles" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>

        <section class="hero-copy pixel-card">
          <p class="label">PIXEL TEST</p>
          <h1>关于我的<br />小测试</h1>
          <p>看看你对我了解多少吧。</p>
        </section>

        <div class="gameboy" aria-hidden="true">
          <div class="gameboy-screen">
            <div class="pixel-face">
              <span class="ear left"></span>
              <span class="ear right"></span>
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="mouth"></span>
            </div>
          </div>
          <span class="cross-key"></span>
          <span class="round-key key-a"></span>
          <span class="round-key key-b"></span>
        </div>

        <button class="primary-button" data-action="start">开始测试</button>
      </div>
    </template>

    <template id="quiz-template">
      <div class="screen screen-quiz">
        <div class="progress-slot"></div>

        <section class="question-card pixel-card">
          <div class="question-meta">
            <span data-question-count></span>
            <span data-question-type></span>
          </div>
          <h2 data-question-title></h2>
        </section>

        <div class="answers" data-answers></div>

        <button class="secondary-button" data-action="submit-multi" hidden>确认答案</button>

        <p class="feedback" data-feedback>选一个答案吧。</p>
      </div>
    </template>

    <template id="complete-template">
      <div class="screen screen-complete">
        <div class="progress-slot"></div>

        <section class="complete-copy">
          <p class="label">LEVEL CLEAR</p>
          <h2>测试完成！</h2>
          <p>你真的很了解我。现在，有一封小信准备好了。</p>
        </section>

        <div class="mailbox-scene" aria-hidden="true">
          <div class="pixel-cloud cloud-a"></div>
          <div class="pixel-cloud cloud-b"></div>
          <div class="mailbox">
            <span class="mailbox-flag"></span>
            <span class="mail-letter"></span>
          </div>
          <div class="pixel-grass"></div>
        </div>

        <button class="primary-button is-pink" data-action="open-letter">打开信箱</button>
      </div>
    </template>

    <template id="letter-template">
      <div class="screen screen-letter">
        <div class="progress-slot"></div>

        <article class="letter-card pixel-card">
          <p class="label">SECRET LETTER</p>
          <h2>给你的信</h2>
          <div class="letter-body" data-letter-body></div>
        </article>

        <button class="secondary-button" data-action="restart">再看一次测试</button>
      </div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
